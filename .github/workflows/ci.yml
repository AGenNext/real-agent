name: CI

# Gate: build, schema validation, and tests (incl. a live SurrealDB) must pass.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build & vet
        run: |
          (cd reference/surrealdb && go build ./... && go vet ./...)
          (cd reference/agent-lang && go build ./... && go vet ./...)

      - name: Go unit tests (agent-lang)
        run: cd reference/agent-lang && go test ./...

      - name: Compile the example agent
        run: cd reference/agent-lang && go run ./cmd/agentc examples/cluster-janitor.agent > /tmp/agent.json

      - name: Start SurrealDB
        run: |
          docker run -d --name surreal -p 8000:8000 surrealdb/surrealdb:v3.1.3 \
            start --user root --pass root --bind 0.0.0.0:8000 memory
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done

      - name: Go integration tests (SurrealDB)
        env:
          SURREAL_ENDPOINT: ws://localhost:8000/rpc
        run: cd reference/surrealdb && go test ./...

      - name: Validate JSON Schemas + compiled agent
        run: |
          python -m pip install --quiet jsonschema
          python - <<'PY'
          import json, glob
          from jsonschema import Draft202012Validator
          for f in sorted(glob.glob("schemas/*.schema.json")):
              Draft202012Validator.check_schema(json.load(open(f)))
              print("schema valid:", f)
          Draft202012Validator(json.load(open("schemas/agent.schema.json"))).validate(
              json.load(open("/tmp/agent.json")))
          print("compiled agent validates against agent.schema.json")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Langium grammar build + parse test
        run: |
          cd reference/agent-lang/langium
          npm ci
          npm run langium:generate
          npm test
